
services:
  db:
    image: postgres:16-alpine
    container_name: siem_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: siem
      POSTGRES_PASSWORD: siem_password
      POSTGRES_DB: siem_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siem -d siem_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: siem_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://siem:siem_password@db:5432/siem_db
      PYTHONUNBUFFERED: "1"
      DEFAULT_API_KEY: ${DEFAULT_API_KEY:-dev-local-siem-key-2026}
      MASTER_API_KEY: ${MASTER_API_KEY:-master-key-change-in-prod}
      LOG_RETENTION_DAYS: "30"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./tests:/app/tests
      - ./geoip:/app/geoip
      - ./scripts:/app/scripts

  frontend:
    build: ./frontend
    container_name: siem_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_API_KEY: dev-local-siem-key-2026
    depends_on:
      - api
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:
